version: 1

service:
  name: demo-fhir-api
  upstream: http://localhost:4001
  description: Synthetic FHIR and prior-authorization API protected by HealthAgent Passport.

demo:
  syntheticOnly: true
  noMedicalAdvice: true
  artificialStepDelayMs: 650

agents:
  trusted-care-agent:
    name: TrustedCareAgent
    publicKeyFile: ./.hap/agents/trusted-care-agent.json
    defaultTrustTier: AAA

  sketchy-scraper-agent:
    name: SketchyScraperAgent
    publicKeyFile: ./.hap/agents/sketchy-scraper-agent.json
    defaultTrustTier: C

routes:
  - id: read-patient-fhir
    description: Read scoped synthetic FHIR bundle for one patient.
    match:
      method: GET
      path: /fhir/patient/:patientId
    patientContext:
      source: path
      param: patientId
    requiredScopes:
      - patient/Patient.read
      - patient/Condition.read
      - patient/MedicationRequest.read
      - patient/Observation.read
    trust:
      minScore: 85
      allowedRoutes:
        - prod
        - prod_throttled
    sandbox:
      required: true
      maxRiskScore: 20

  - id: submit-prior-auth
    description: Submit synthetic prior authorization package.
    match:
      method: POST
      path: /prior-auth
    patientContext:
      source: body
      field: patientId
    requiredScopes:
      - payer/PriorAuth.write
    trust:
      minScore: 85
      allowedRoutes:
        - prod
        - prod_throttled
    sandbox:
      required: true
      maxRiskScore: 20

deny:
  - id: deny-bulk-fhir
    match:
      method: GET
      pathPrefix: /fhir/all
    reason: Bulk patient export is not allowed for autonomous agents in this demo.
